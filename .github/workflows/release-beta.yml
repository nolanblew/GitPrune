name: Release Beta

on:
  push:
    tags:
      - 'b*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version number without the b prefix (example: 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Resolve Release Metadata
      id: release_info
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/b}"
        fi

        VERSION="${VERSION#b}"
        TAG="b${VERSION}"

        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
    - name: Create Release Tag
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        TAG="${{ steps.release_info.outputs.TAG }}"

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists locally."
          exit 1
        fi

        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists on origin."
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "refs/tags/$TAG"
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Set Build Environment
      run: |
        cat <<'EOF' > Secrets.cs
          public class Secrets { public static string ClientId => "${{ secrets.GH_PRUNE_CLIENT_ID }}"; public static string ClientSecret => "${{ secrets.GH_PRUNE_CLIENT_SECRET }}"; public static string AzureBlobTableKey => "${{ secrets.AZ_BLOB_ACCESS_KEY }}"; public static string AnalyticsInstrumentationConnectionString => "${{ secrets.ANALYTICS_CONNECTION_STRING }}"; }
        EOF
        
    - name: Build Windows x64
      run: dotnet publish -r win-x64 --configuration Release --self-contained true -p:PublishSingleFile=true -p:Version="${{ steps.release_info.outputs.VERSION }}" /p:IsBeta=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true
    - name: Build Linux x64
      run: dotnet publish -r linux-x64 --configuration Release --self-contained true -p:PublishSingleFile=true -p:Version="${{ steps.release_info.outputs.VERSION }}" /p:IsBeta=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true
    - name: Build OSX x64
      run: dotnet publish -r osx-x64 --configuration Release --self-contained true -p:PublishSingleFile=true -p:Version="${{ steps.release_info.outputs.VERSION }}" /p:IsBeta=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true
      
    - name: Setup Publish Directory
      run: |
        mkdir publish_files
        cp install-beta.sh publish_files/install.sh
        cp install-beta.ps1 publish_files/install.ps1
        cp install-beta.cmd publish_files/install.cmd

    - name: Zip Releases
      run: |
        zip -rj publish_files/gitprune-win-x64.zip bin/Release/net8.0/win-x64/publish
        tar -czf publish_files/gitprune-linux-x64.tar.gz -C bin/Release/net8.0/linux-x64/publish .
        tar -czf publish_files/gitprune-osx-x64.tar.gz -C bin/Release/net8.0/osx-x64/publish .

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Release-Beta-Files
        path: publish_files

    - name: Upload Releases
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURECONTAINERCONNECTIONSTRING }}
      run: |
        az storage container create --name "git-prune-beta" --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --only-show-errors
        az storage blob delete-batch --source "git-prune-beta" --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --pattern "*" --only-show-errors
        az storage blob upload-batch --destination "git-prune-beta" --source "publish_files" --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --overwrite true --only-show-errors

    - name: Update Version Number
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.ACURETABLECONNECTIONSTRING }}
      run: |
        az storage table create --name "gitprune" --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --only-show-errors
        az storage entity insert --table-name "gitprune" --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --if-exists replace --only-show-errors --entity "PartitionKey=version" "RowKey=beta" "version_number=${{ steps.release_info.outputs.VERSION }}" "version_number@odata.type=Edm.String"

